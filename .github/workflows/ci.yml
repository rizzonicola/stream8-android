name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.10.2'

jobs:
  build:
    name: Build e test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Installa la versione di Gradle indicata e configura la cache. Non dipende da gradle-wrapper.jar.
      - name: Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verifica configurazione Gradle
        run: gradle --no-daemon help --warning-mode=all

      - name: Test unitari
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint e compilazione debug
        run: gradle --no-daemon lintDebug assembleDebug

      - name: Compilazione release (non firmata) e verifica degli APK
        run: |
          gradle --no-daemon collectReleaseApks
          REQUIRE_SIGNED=0 bash scripts/verify-apks.sh build/dist

      - name: Report di test e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 7
